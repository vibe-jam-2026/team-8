<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tryck inte</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    display: grid; place-items: center;
    background: #f4f1ea;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #knapp {
    font: inherit; font-size: clamp(22px, 5vw, 36px); font-weight: 700;
    padding: 20px 48px; border: 0; border-radius: 999px;
    background: #FFE135; color: #3b2f00; cursor: pointer;
    box-shadow: 0 6px 0 #c9a800;
  }
  #knapp:active { transform: translateY(4px); box-shadow: 0 2px 0 #c9a800; }

  #scare {
    position: fixed; inset: -30px; display: none;
    background: #000; place-items: center; overflow: hidden;
  }
  #scare.on { display: grid; animation: shake .08s linear infinite; }
  #scare img {
    width: 100vmin; height: 100vmin; object-fit: cover;
    image-rendering: pixelated;
    filter: contrast(1.6) brightness(1.1);
    animation: zoom .35s cubic-bezier(.2, 1.6, .4, 1) forwards;
  }
  #scare::after {
    content: ""; position: absolute; inset: 0;
    background: #ff0000; mix-blend-mode: multiply;
    animation: red .6s ease-out forwards;
  }
  @keyframes zoom { from { transform: scale(.05); } to { transform: scale(1.05); } }
  @keyframes red { from { opacity: .7; } to { opacity: .12; } }
  @keyframes shake {
    0%   { transform: translate(0, 0); }
    25%  { transform: translate(-12px, 8px); }
    50%  { transform: translate(10px, -10px); }
    75%  { transform: translate(-8px, -6px); }
    100% { transform: translate(0, 0); }
  }
</style>
</head>
<body>
<button id="knapp">Tryck här</button>
<div id="scare"><img src="assets/ansikte.jpg" alt=""></div>

<script>
const knapp = document.getElementById('knapp');
const scare = document.getElementById('scare');

// A scream made with the Web Audio API, so no sound file is needed
function scream() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const now = ctx.currentTime, len = 1.6;
  const out = ctx.createGain();
  out.gain.setValueAtTime(0.9, now);
  out.gain.exponentialRampToValueAtTime(0.001, now + len);
  out.connect(ctx.destination);

  // Screeching tones
  for (const [type, f] of [['sawtooth', 880], ['square', 1240], ['sawtooth', 620]]) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f, now);
    o.frequency.linearRampToValueAtTime(f * 1.5, now + 0.15);
    o.frequency.linearRampToValueAtTime(f * 0.7, now + len);
    const lfo = ctx.createOscillator(), lfoGain = ctx.createGain();
    lfo.frequency.value = 28; lfoGain.gain.value = f * 0.08;
    lfo.connect(lfoGain).connect(o.frequency);
    const g = ctx.createGain(); g.gain.value = 0.18;
    o.connect(g).connect(out);
    o.start(now); lfo.start(now); o.stop(now + len); lfo.stop(now + len);
  }

  // Noise burst
  const buf = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource(); noise.buffer = buf;
  const ng = ctx.createGain(); ng.gain.value = 0.35;
  noise.connect(ng).connect(out);
  noise.start(now);
}

knapp.addEventListener('click', () => {
  knapp.style.display = 'none';
  scare.classList.add('on');
  try { scream(); } catch (e) {}
  // Stop shaking after a moment, then go back to the button
  setTimeout(() => scare.classList.remove('on'), 2000);
  setTimeout(() => { knapp.style.display = ''; }, 2000);
});
</script>
</body>
</html>
