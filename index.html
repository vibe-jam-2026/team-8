<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team 8</title>
<style>
  :root { --y: #FFB838; --ink: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: #0b0a12;
    overflow: hidden;
  }

  /* Slowly shifting, pulsing colour background */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, #ff3d7f 0, transparent 45%),
      radial-gradient(circle at 80% 20%, #3d8bff 0, transparent 45%),
      radial-gradient(circle at 50% 85%, var(--y) 0, transparent 50%),
      #0b0a12;
    background-size: 160% 160%;
    animation: drift 18s ease-in-out infinite alternate, pulse 3s ease-in-out infinite;
  }
  @keyframes drift {
    0%   { background-position: 0% 0%; filter: hue-rotate(0deg); }
    100% { background-position: 100% 100%; filter: hue-rotate(120deg); }
  }
  @keyframes pulse {
    0%, 100% { opacity: .55; }
    50%      { opacity: 1; }
  }

  /* Blinking lights */
  .lights { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .lights span {
    position: absolute;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 12px 3px currentColor;
    opacity: 0;
    animation: blink var(--d) ease-in-out var(--delay) infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0; transform: scale(.4); }
    50%      { opacity: 1; transform: scale(1); }
  }

  main {
    position: relative; z-index: 2;
    height: 100%;
    display: grid; place-items: center; text-align: center;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: clamp(56px, 14vw, 160px);
    font-weight: 800;
    letter-spacing: -.02em;
    text-shadow: 0 0 24px rgba(255,255,255,.6), 0 0 60px var(--y);
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 16px rgba(255,255,255,.4), 0 0 40px var(--y); }
    50%      { text-shadow: 0 0 32px rgba(255,255,255,.9), 0 0 90px var(--y); }
  }
  p { margin: 8px 0 0; font-size: 18px; opacity: .85; }
  a { color: var(--y); }

  @media (prefers-reduced-motion: reduce) {
    .bg, .lights span, h1 { animation: none; }
    .lights span { opacity: .6; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="lights" aria-hidden="true"></div>
<main>
  <div>
    <h1>Team 8</h1>
    <p>Vibe Jam 2026</p>
    <p><a href="instructions.html">Instruktioner</a></p>
  </div>
</main>
<script>
  // Sprinkle blinking lights across the screen
  const colors = ['#fff', '#FFB838', '#ff3d7f', '#3d8bff', '#7dffb0'];
  const box = document.querySelector('.lights');
  const count = Math.round(Math.min(160, (innerWidth * innerHeight) / 9000));
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span');
    const size = 2 + Math.random() * 5;
    s.style.cssText =
      `left:${Math.random() * 100}%;top:${Math.random() * 100}%;` +
      `width:${size}px;height:${size}px;` +
      `color:${colors[i % colors.length]};` +
      `--d:${(1.2 + Math.random() * 2.8).toFixed(2)}s;` +
      `--delay:${(-Math.random() * 4).toFixed(2)}s;`;
    box.appendChild(s);
  }
</script>
</body>
</html>
