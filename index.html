<style>
  :root { --y: #FFB838; --ink: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--ink);
    background: #0b0a12;
    overflow: hidden;
  }

  /* Slowly shifting, pulsing colour background */
  .bg {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(circle at 20% 30%, #ff3d7f 0, transparent 45%),
      radial-gradient(circle at 80% 20%, #3d8bff 0, transparent 45%),
      radial-gradient(circle at 50% 85%, var(--y) 0, transparent 50%),
      #0b0a12;
    background-size: 160% 160%;
    animation: drift 10s ease-in-out infinite alternate, pulse 1.6s ease-in-out infinite;
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    animation: flash 4.8s steps(1) infinite, fade 1.2s ease-in-out infinite;
  }
  @keyframes flash {
    0%   { background: #ff3d7f; }
    25%  { background: #3d8bff; }
    50%  { background: #FFB838; }
    75%  { background: #7dffb0; }
  }
  @keyframes fade {
    0%, 100% { opacity: 0; }
    50%      { opacity: .45; }
  }
  @keyframes drift {
    0%   { background-position: 0% 0%; filter: hue-rotate(0deg); }
    100% { background-position: 100% 100%; filter: hue-rotate(120deg); }
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }

  /* Blinking lights */
  .lights { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  .lights span {
    position: absolute;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 18px 6px currentColor;
    opacity: 0;
    animation: blink var(--d) ease-in-out var(--delay) infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0; transform: scale(.4); }
    50%      { opacity: 1; transform: scale(1); }
  }

  main {
    position: relative; z-index: 2;
    height: 100%;
    display: grid; place-items: center; text-align: center;
    padding: 16px;
  }
  h1 {
    margin: 0;
    font-size: clamp(56px, 14vw, 160px);
    font-weight: 800;
    letter-spacing: -.02em;
    text-shadow: 0 0 24px rgba(255,255,255,.6), 0 0 60px var(--y);
    animation: glow 2s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 16px rgba(255,255,255,.4), 0 0 40px var(--y); }
    50%      { text-shadow: 0 0 32px rgba(255,255,255,.9), 0 0 90px var(--y); }
  }
  p { margin: 8px 0 0; font-size: 18px; opacity: .85; }
  a { color: var(--y); }

  @media (prefers-reduced-motion: reduce) {
    .bg, .bg::after, .lights span, h1 { animation: none; }
    .lights span { opacity: .6; }
  }
</style>
</head>
